# Despliegue en Render (render.com) desde el repositorio.
# La clave de la API NO va aquí: Render la pide al crear el servicio.
# Si la web del cliente está en otro dominio, añade después en el panel de
# Render la variable ORIGENES_PERMITIDOS (ej.: https://www.minegocio.com).
services:
  - type: web
    name: chatbot-ia-gimnasio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python servidor.py
    healthCheckPath: /api/estado
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
